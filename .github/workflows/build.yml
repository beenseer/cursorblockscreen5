name: Build Cursor Block 5 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        run: |
          find_settings() {
            find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path './.git/*' -not -path './_unzipped/*' | head -n 1
          }
          SETTINGS="$(find_settings)"
          if [ -z "$SETTINGS" ]; then
            ZIP="$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)"
            if [ -n "$ZIP" ]; then
              mkdir -p _unzipped
              unzip -q -o "$ZIP" -d _unzipped
              SETTINGS="$(find _unzipped -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
            fi
          fi
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle(.kts) not found"
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found"
            find "$PROJECT_DIR" -name '*.apk'
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/CursorBlock5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CursorBlock5-debug-apk
          path: dist/CursorBlock5.apk
          if-no-files-found: error
